name: Shiny calculator smoke test
on:
  push:
    branches: ["2024-tripod-reproducibility"]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::bslib
      - name: Check locked public prediction equation
        run: Rscript tests/test_equation.R
      - name: Load root Shiny entry point
        run: Rscript -e 'x <- source("app.R", local=TRUE)$value; stopifnot(inherits(x, "shiny.appobj")); cat("Shiny app loaded successfully\n")'
