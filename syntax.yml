name: R source syntax
on:
  push:
    branches: ["main", "2024-tripod-reproducibility"]
  pull_request:
jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Parse all R source files
        run: Rscript -e 'for (p in list.files(".", pattern="[.]R$", recursive=TRUE, full.names=TRUE)) { parse(file=p); cat("Parsed:",p,"\n") }'

      - name: Verify published equation without NCDB data
        run: Rscript tests/test_equation.R
