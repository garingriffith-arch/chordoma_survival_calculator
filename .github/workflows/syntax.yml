name: R source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Parse all R source files
        run: |
          Rscript -e 'fs <- list.files(".", pattern="[.]R$", recursive=TRUE, full.names=TRUE); stopifnot(length(fs) >= 12L); for (p in fs) { parse(file=p); cat("Parsed:",p,"\n") }'
      - name: Test locked equation
        run: Rscript tests/test_equation.R
