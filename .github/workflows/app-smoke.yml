name: Shiny smoke test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::bslib
      - name: Test locked equation
        run: Rscript tests/test_equation.R
      - name: Verify startup requires no NCDB PUF
        run: |
          Rscript -e 'Sys.unsetenv("NCDB_BONE_PUF"); shiny::loadSupport(appDir="."); x <- source("app.R", local=TRUE)$value; stopifnot(inherits(x, "shiny.appobj")); cat("Shiny startup has no NCDB dependency\n")'
